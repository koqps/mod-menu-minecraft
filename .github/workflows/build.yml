          grep -q '^com/koqps/topka/ui/TopkaScreen.class$' jar-contents.txt
          grep -q '^com/koqps/topka/ui/UiFont.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/HealthHud.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldVisuals.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldLabels.class$' jar-contents.txt
          grep -q '^assets/topka/font/ui.json$' jar-contents.txt

      - name: Upload normal mod jar
