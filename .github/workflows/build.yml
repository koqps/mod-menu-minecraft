name: Build Mod Menu

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify normal mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          echo "Verifying $JAR"
          jar tf "$JAR" | tee jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt
          grep -q '^topka.client.mixins.json$' jar-contents.txt
          grep -q '^com/koqps/topka/TopkaClient.class$' jar-contents.txt
          grep -q '^com/koqps/topka/mixin/NoHurtCamMixin.class$' jar-contents.txt
          grep -q '^com/koqps/topka/mixin/OverlayTextureAccessor.class$' jar-contents.txt
          grep -q '^com/koqps/topka/ui/TopkaScreen.class$' jar-contents.txt

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-menu-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
