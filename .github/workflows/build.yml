name: Build Mod Menu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify mod jar contents
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No normal mod jar found"
            exit 1
          fi
          echo "Checking $JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt
          grep -q '^topka.client.mixins.json$' jar-contents.txt
          grep -q '^com/koqps/topka/TopkaClient.class$' jar-contents.txt
          grep -q '^com/koqps/topka/mixin/NoHurtCamMixin.class$' jar-contents.txt
          grep -q '^com/koqps/topka/mixin/ClientLevelTimeMixin.class          grep -q '^com/koqps/topka/ui/TopkaScreen.class$' jar-contents.txt
          grep -q '^com/koqps/topka/ui/UiFont.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/HealthHud.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldVisuals.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldLabels.class$' jar-contents.txt
          grep -q '^assets/topka/font/ui.json$' jar-contents.txt

      - name: Upload normal mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-menu-minecraft-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
 jar-contents.txt
          grep -q '^com/koqps/topka/mixin/SkyRendererTimeMixin.class          grep -q '^com/koqps/topka/ui/TopkaScreen.class$' jar-contents.txt
          grep -q '^com/koqps/topka/ui/UiFont.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/HealthHud.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldVisuals.class$' jar-contents.txt
          grep -q '^com/koqps/topka/hud/WorldLabels.class$' jar-contents.txt
          grep -q '^assets/topka/font/ui.json$' jar-contents.txt

      - name: Upload normal mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-menu-minecraft-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
