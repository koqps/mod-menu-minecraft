name: Build Mod Menu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify compiled 0.12.9 systems
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt
          grep -q '^topka.client.mixins.json$' jar-contents.txt
          grep -q '^com/koqps/topka/TopkaClient.class$' jar-contents.txt
          grep -q '^com/koqps/topka/asset/PackedMeshLibrary.class$' jar-contents.txt
          grep -q '^com/koqps/topka/asset/PackedTextureRegistry.class$' jar-contents.txt
          grep -q '^com/koqps/topka/asset/PackedMeshSubmitter.class$' jar-contents.txt
          grep -q '^com/koqps/topka/cosmetic/ImportedCosmeticRenderer.class$' jar-contents.txt
          grep -q '^com/koqps/topka/cosmetic/NetheriteCosmeticArmorRenderer.class$' jar-contents.txt
          grep -q '^com/koqps/topka/ui/CosmeticsScreen.class$' jar-contents.txt
          grep -q '^com/koqps/topka/item/WeaponThemeProperty.class$' jar-contents.txt
          grep -q '^com/koqps/topka/item/WeaponMeshSpecialRenderer.class$' jar-contents.txt
          grep -q '^assets/minecraft/items/diamond_sword.json$' jar-contents.txt
          grep -q '^assets/minecraft/items/netherite_sword.json$' jar-contents.txt
          grep -q '^assets/minecraft/items/bow.json$' jar-contents.txt
          grep -q '^assets/minecraft/items/shield.json$' jar-contents.txt
          grep -q '^assets/minecraft/items/trident.json$' jar-contents.txt
          grep -q '^assets/minecraft/items/mace.json$' jar-contents.txt

      - name: Upload normal mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-menu-minecraft-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
